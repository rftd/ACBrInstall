[workspace]
members = ["crates/install-core", "crates/install-ui", "apps/acbrinstall", "apps/pascalinstall"]
default-members = ["apps/acbrinstall", "apps/pascalinstall"]
resolver = "2"

[workspace.package]
version = "0.4.0"
edition = "2021"
repository = "https://github.com/rftd/ACBrInstall"
authors = ["Rafael Teno DIas"]
license = "MIT"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
